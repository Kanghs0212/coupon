<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATCH SEAT (캐치시트) - 티켓 예매 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }

        /* 티켓 가장자리 절취선 효과 */
        .ticket-cutout {
            mask-image: radial-gradient(circle at 0 50%, transparent 10px, black 11px), radial-gradient(circle at 100% 50%, transparent 10px, black 11px);
            mask-size: 51% 100%;
            mask-repeat: no-repeat;
            mask-position: left, right;
        }

        /* 스크롤바 숨기기 (가로 스크롤 좌석 맵용) */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // JWT 디코딩 (memberId, username 추출)
    const parseJwt = (token) => {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        } catch (e) {
            return null;
        }
    };

    // 토큰 만료 여부 확인 (JWT exp는 초 단위)
    const isExpired = (decoded) => !decoded.exp || decoded.exp * 1000 <= Date.now();

    function App() {
        // 앱 화면 상태 관리 (login, signup, concertList, seat, mypage)
        const [view, setView] = useState('login');
        const [token, setToken] = useState(localStorage.getItem('jwt_token') || null);
        const [user, setUser] = useState(null);

        // 데이터 상태
        const [concerts, setConcerts] = useState([]);
        const [selectedConcert, setSelectedConcert] = useState(null);
        const [seats, setSeats] = useState([]);
        const [myReservations, setMyReservations] = useState([]);
        const [waiting, setWaiting] = useState(null); // 대기열 상태 {status, position, total}
        const [pending, setPending] = useState(null); // 결제 화면의 현재 선점 건
        const [remainSec, setRemainSec] = useState(null); // 결제 화면 남은 시간(초)
        const [pendingList, setPendingList] = useState([]); // 마이페이지 결제 대기 목록
        const [now, setNow] = useState(Date.now());   // 마이페이지 카운트다운용 현재시각
        const pollRef = useRef(null);                 // 대기 순번 폴링 인터벌
        const pendingRef = useRef(null);              // 결제 대기 예매(최신값)
        const payTimerRef = useRef(null);             // 결제 카운트다운 인터벌

        // 폼 상태
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [name, setName] = useState('');

        // 토큰이 있으면: 유효성+만료 확인 후 콘서트 목록 띄우기. 만료/위조면 자동 로그아웃
        useEffect(() => {
            if (token) {
                const decoded = parseJwt(token);
                if (decoded && !isExpired(decoded)) {
                    setUser(decoded);
                    fetchConcerts();
                    setView('concertList');

                    // 탭을 열어둔 채 만료되는 경우까지 대비해, 남은 시간 뒤 자동 로그아웃 예약
                    const timer = setTimeout(() => {
                        alert('로그인이 만료되었습니다. 다시 로그인해주세요.');
                        handleLogout();
                    }, decoded.exp * 1000 - Date.now());
                    return () => clearTimeout(timer);
                } else {
                    handleLogout();
                }
            }
        }, [token]);

        // 마이페이지에 있을 때만 1초마다 카운트다운 갱신
        useEffect(() => {
            if (view !== 'mypage') return;
            const t = setInterval(() => setNow(Date.now()), 1000);
            return () => clearInterval(t);
        }, [view]);

        // --- API 통신 함수들 ---

        // 1. 로그인
        const handleLogin = async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('http://localhost:8080/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    const data = await res.text();
                    localStorage.setItem('jwt_token', data);
                    setToken(data);
                } else {
                    alert(`❌ 로그인 실패: ${await res.text()}`);
                }
            } catch(error) {
                alert('서버에 연결할 수 없습니다. 백엔드가 켜져있는지 확인하세요.');
            }
        };

        // 2. 회원가입
        const handleSignup = async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('http://localhost:8080/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, name })
                });
                if (res.ok) {
                    alert('회원가입 성공! 로그인을 진행해주세요.');
                    setView('login');
                } else {
                    alert(`❌ 가입 실패: ${await res.text()}`);
                }
            } catch(error) {
                alert('서버에 연결할 수 없습니다.');
            }
        };

        // 3. 로그아웃
        const handleLogout = () => {
            if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
            if (payTimerRef.current) { clearInterval(payTimerRef.current); payTimerRef.current = null; }
            localStorage.removeItem('jwt_token');
            setToken(null);
            setUser(null);
            setView('login');
            setUsername('');
            setPassword('');
        };

        // 4. 콘서트 목록 조회
        const fetchConcerts = async () => {
            try {
                const res = await fetch('http://localhost:8080/concerts');
                if(res.ok) {
                    setConcerts(await res.json());
                }
            } catch (error) {
                console.error("콘서트 목록을 불러오지 못했습니다.", error);
            }
        };

        // 5. 좌석 목록 조회
        const fetchSeats = async (concert) => {
            setSelectedConcert(concert);
            try {
                const res = await fetch(`http://localhost:8080/concerts/${concert.id}/seats`);
                if(res.ok) {
                    const data = await res.json();

                    // 가격, 좌석 이름 기준 정렬
                    const sortedSeats = data.sort((a, b) => {
                        // 가격 내림차순
                        if (b.price !== a.price) return b.price - a.price;

                        // 같은 가격이면 좌석 이름 자연 정렬
                        return a.seatName.localeCompare(b.seatName, undefined, { numeric: true, sensitivity: 'base' });
                    });

                    // 새 배열로 교체
                    setSeats([...sortedSeats]);
                    setView('seat'); // 좌석 선택 화면으로
                }
            } catch (error) {
                console.error("좌석 목록을 불러오지 못했습니다.", error);
            }
        };

        // 대기열 진입 → 입장되면 좌석 화면으로
        const enterWaiting = async (concert) => {
            setSelectedConcert(concert);
            setWaiting(null);
            setView('waiting');
            try {
                const res = await fetch(`http://localhost:8080/concerts/${concert.id}/waiting`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.status === 'ADMITTED') { startSeats(concert); return; }
                setWaiting(data);
                if (pollRef.current) clearInterval(pollRef.current);
                pollRef.current = setInterval(() => pollWaiting(concert), 1000);
            } catch (error) {
                alert('대기열 진입에 실패했습니다.');
                setView('concertList');
            }
        };

        // 대기 순번 폴링
        const pollWaiting = async (concert) => {
            try {
                const res = await fetch(`http://localhost:8080/concerts/${concert.id}/waiting`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.status === 'ADMITTED') startSeats(concert);
                else setWaiting(data);
            } catch (error) {
                // 일시적 오류는 무시하고 다음 폴링에서 재시도
            }
        };

        // 입장 완료 시 좌석 화면으로
        const startSeats = (concert) => {
            if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
            fetchSeats(concert);
        };

        // 대기 취소
        const leaveWaiting = () => {
            if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
            setView('concertList');
        };

        // 6. 좌석 선점 (누르면 선점 → 결제 화면으로)
        const handleReserve = async (seat) => {
            if (!user) return;

            // 이미 선점/예매된 좌석 차단
            if (seat.status === 'RESERVED' || seat.status === 'HELD') {
                alert('이미 선택되었거나 예매된 좌석입니다. 다른 좌석을 선택해주세요.');
                return;
            }

            const isConfirm = window.confirm(`[${seat.seatName}] 좌석을 선점하시겠습니까?\n가격: ${seat.price.toLocaleString()}원\n선점 후 제한 시간 내에 결제해야 합니다.`);
            if (!isConfirm) return;

            try {
                const res = await fetch(`http://localhost:8080/concerts/${selectedConcert.id}/reserve?seatId=${seat.id}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    goPayment(); // 선점 접수 → 결제 화면으로
                } else {
                    alert(`선점 실패: ${await res.text()}`);
                }
            } catch (error) {
                alert('서버 오류로 선점에 실패했습니다.');
            }
        };

        // 결제 화면 진입: 선점된 예매를 조회하고 카운트다운 시작
        const goPayment = () => {
            pendingRef.current = null;
            setPending(null);
            setRemainSec(null);
            setView('payment');
            if (payTimerRef.current) clearInterval(payTimerRef.current);
            payTimerRef.current = setInterval(paymentTick, 1000);
            paymentTick();
        };

        // 결제 화면 1초 틱: 선점 조회 → 카운트다운 → 만료 처리
        const paymentTick = async () => {
            if (!pendingRef.current) {
                try {
                    const res = await fetch('http://localhost:8080/reservations/pending', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const list = await res.json();
                        const found = list.find(r => r.concertId === selectedConcert.id);
                        if (found) { pendingRef.current = found; setPending(found); }
                    }
                } catch (error) {
                    // 다음 틱에 재시도
                }
                return;
            }
            const remain = Math.floor((new Date(pendingRef.current.expiresAt).getTime() - Date.now()) / 1000);
            if (remain <= 0) {
                stopPayTimer();
                alert('결제 시간이 만료되어 좌석이 해제되었습니다.');
                setView('concertList');
                return;
            }
            setRemainSec(remain);
        };

        // 결제하기
        const handlePay = async () => {
            if (!pendingRef.current) return;
            try {
                const res = await fetch(`http://localhost:8080/reservations/${pendingRef.current.reservationId}/pay`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    stopPayTimer();
                    alert('결제가 완료되었습니다!');
                    fetchMyReservations();
                    setView('mypage');
                } else {
                    alert(`결제 실패: ${await res.text()}`);
                }
            } catch (error) {
                alert('결제 중 오류가 발생했습니다.');
            }
        };

        const stopPayTimer = () => {
            if (payTimerRef.current) { clearInterval(payTimerRef.current); payTimerRef.current = null; }
        };

        // 결제를 미루고 마이페이지로 (선점은 유지 → 목록에서 이어서 결제)
        const leavePayment = () => {
            stopPayTimer();
            fetchMyReservations();
            setView('mypage');
        };

        // 마이페이지에서 선점한 좌석 결제 이어하기
        const resumePayment = (p) => {
            pendingRef.current = p;
            setPending(p);
            setRemainSec(Math.max(0, Math.floor((new Date(p.expiresAt).getTime() - Date.now()) / 1000)));
            setView('payment');
            if (payTimerRef.current) clearInterval(payTimerRef.current);
            payTimerRef.current = setInterval(paymentTick, 1000);
            paymentTick();
        };

        // 남은 시간 mm:ss 포맷
        const formatMMSS = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;

        // 7. 내 예매 내역 조회 (결제 완료 + 결제 대기)
        const fetchMyReservations = async () => {
            if (!user) return;
            try {
                const [meRes, pendRes] = await Promise.all([
                    fetch('http://localhost:8080/reservations/me', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('http://localhost:8080/reservations/pending', { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                if (meRes.ok) setMyReservations(await meRes.json());
                if (pendRes.ok) setPendingList(await pendRes.json());
            } catch (error) {
                console.error("내역을 불러오지 못했습니다.", error);
            }
        };


        // --- UI 컴포넌트 렌더링 영역 ---

        // 네비게이션 바 컴포넌트
        const Navbar = () => (
            <nav className="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
                {/* 로고 */}
                <h1 className="text-2xl font-black text-red-500 tracking-tighter cursor-pointer" onClick={() => user && setView('concertList')}>
                    CATCH SEAT
                </h1>
                {user && (
                    <div className="flex items-center gap-4">
                        <span className="text-sm font-medium hidden md:inline">{user.sub} 님 환영합니다</span>
                        <button onClick={() => {fetchMyReservations(); setView('mypage');}} className="text-sm font-bold text-gray-300 hover:text-white">
                            마이페이지
                        </button>
                        <button onClick={handleLogout} className="text-xs border border-gray-600 px-3 py-1 rounded font-bold hover:bg-gray-800 transition">
                            로그아웃
                        </button>
                    </div>
                )}
            </nav>
        );

        return (
            <div className="min-h-screen flex flex-col bg-gray-100">
                <Navbar />

                <main className="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8">

                    {/* 1. 로그인 화면 */}
                    {view === 'login' && (
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md mx-auto mt-10 border border-gray-200">
                            <h2 className="text-2xl font-bold mb-6 text-center text-gray-800">로그인</h2>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="text" placeholder="아이디" value={username} onChange={e=>setUsername(e.target.value)} required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none" />
                                <input type="password" placeholder="비밀번호" value={password} onChange={e=>setPassword(e.target.value)} required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none" />
                                <button type="submit" className="w-full bg-red-600 text-white p-3 rounded-lg font-bold hover:bg-red-700 transition">로그인</button>
                            </form>
                            <p className="mt-4 text-center text-sm text-gray-500 cursor-pointer hover:underline" onClick={() => setView('signup')}>회원가입하기</p>
                        </div>
                    )}

                    {/* 2. 회원가입 화면 */}
                    {view === 'signup' && (
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md mx-auto mt-10 border border-gray-200">
                            <h2 className="text-2xl font-bold mb-6 text-center text-gray-800">회원가입</h2>
                            <form onSubmit={handleSignup} className="space-y-4">
                                <input type="text" placeholder="아이디" value={username} onChange={e=>setUsername(e.target.value)} required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-gray-800 outline-none" />
                                <input type="password" placeholder="비밀번호" value={password} onChange={e=>setPassword(e.target.value)} required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-gray-800 outline-none" />
                                <input type="text" placeholder="이름" value={name} onChange={e=>setName(e.target.value)} required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-gray-800 outline-none" />
                                <button type="submit" className="w-full bg-gray-800 text-white p-3 rounded-lg font-bold hover:bg-gray-900 transition">가입하기</button>
                            </form>
                            <p className="mt-4 text-center text-sm text-gray-500 cursor-pointer hover:underline" onClick={() => setView('login')}>로그인으로 돌아가기</p>
                        </div>
                    )}

                    {/* 3. 콘서트 목록 */}
                    {view === 'concertList' && (
                        <div>
                            <h2 className="text-3xl font-bold mb-8 text-gray-800">🔥 티켓오픈 / 단독판매</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {concerts.map(c => (
                                    <div key={c.id} className="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 cursor-pointer group" onClick={() => enterWaiting(c)}>
                                        <div className="h-64 bg-gray-200 relative overflow-hidden flex items-center justify-center">
                                            {/* 이미지 로드 실패 시 기본 썸네일 */}
                                            <img
                                                src={c.posterUrl || `https://picsum.photos/seed/${c.id + 10}/400/300`}
                                                alt={c.title}
                                                onError={(e) => {
                                                    e.target.onerror = null;
                                                    e.target.src = `https://placehold.co/400x300/1f2937/ffffff?text=Catch+Seat`;
                                                }}
                                                className="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                                            />
                                            <div className="absolute top-3 left-3 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded shadow">예매중</div>
                                        </div>
                                        <div className="p-6">
                                            <h3 className="text-xl font-bold text-gray-900 mb-2 truncate">{c.title}</h3>
                                            <p className="text-sm text-gray-500 flex items-center"><span className="mr-2">📍</span>{c.venue}</p>
                                            <button className="mt-5 w-full border-2 border-red-600 text-red-600 font-bold py-2 rounded-lg group-hover:bg-red-600 group-hover:text-white transition">
                                                예매하기
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 대기열 화면 */}
                    {view === 'waiting' && (
                        <div className="max-w-md mx-auto mt-16 bg-white p-10 rounded-2xl shadow-lg border border-gray-200 text-center">
                            <div className="w-14 h-14 mx-auto mb-6 border-4 border-gray-200 border-t-red-600 rounded-full animate-spin"></div>
                            <h2 className="text-xl font-bold text-gray-800 mb-2">입장 대기 중</h2>
                            <p className="text-sm text-gray-500 mb-8">{selectedConcert ? selectedConcert.title : ''}</p>
                            {waiting && waiting.status === 'WAITING' ? (
                                <div>
                                    <p className="text-gray-500 text-sm mb-1">내 대기 순번</p>
                                    <p className="text-6xl font-black text-red-600 mb-2">
                                        {waiting.position.toLocaleString()}<span className="text-2xl font-bold text-gray-400 ml-1">번</span>
                                    </p>
                                    <p className="text-sm text-gray-400">총 {waiting.total.toLocaleString()}명 대기 중</p>
                                </div>
                            ) : (
                                <p className="text-gray-500">잠시만 기다려 주세요...</p>
                            )}
                            <button onClick={leaveWaiting} className="mt-8 text-xs border border-gray-300 px-4 py-2 rounded-lg font-bold text-gray-500 hover:bg-gray-100 transition">
                                대기 취소
                            </button>
                        </div>
                    )}

                    {/* 4. 좌석 선택 화면 */}
                    {view === 'seat' && selectedConcert && (
                        <div className="bg-white p-6 md:p-8 rounded-xl shadow-lg border border-gray-200">
                            <div className="flex justify-between items-center mb-6 border-b pb-4">
                                <div>
                                    <h2 className="text-2xl font-bold text-gray-800">{selectedConcert.title}</h2>
                                    <p className="text-sm text-gray-500 mt-1">{selectedConcert.venue} | 좌석 선택</p>
                                </div>
                                <button onClick={() => setView('concertList')} className="text-gray-500 bg-gray-100 px-4 py-2 rounded-lg hover:bg-gray-200 font-medium text-sm transition">
                                    목록으로 돌아가기
                                </button>
                            </div>

                            <div className="bg-gray-800 text-white text-center py-4 rounded-xl mb-12 text-2xl font-black tracking-[0.5em] shadow-inner">
                                STAGE
                            </div>

                            {/* 좌석 그리드 */}
                            <div className="flex justify-center mb-12 overflow-x-auto hide-scrollbar pb-4">
                                <div className="grid grid-cols-10 gap-2 md:gap-3">
                                    {seats.map(seat => {
                                        // RESERVED/HELD면 비활성화
                                        const isReserved = seat.status === 'RESERVED' || seat.status === 'HELD';
                                        return (
                                            <button
                                                key={seat.id || seat.seatName}
                                                onClick={() => handleReserve(seat)}
                                                disabled={isReserved}
                                                title={`${seat.seatName} - ${seat.price.toLocaleString()}원`}
                                                className={`
                                                        w-8 h-8 md:w-10 md:h-10 rounded-t-xl rounded-b-sm shadow flex items-center justify-center transition-transform transform
                                                        ${isReserved
                                                    ? 'bg-gray-300 cursor-not-allowed opacity-50'
                                                    : seat.seatName.includes('VIP')
                                                        ? 'bg-purple-500 hover:bg-purple-400 hover:-translate-y-1 hover:shadow-lg'
                                                        : 'bg-green-500 hover:bg-green-400 hover:-translate-y-1 hover:shadow-lg'}
                                                    `}
                                            >
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 좌석 범례 */}
                            <div className="bg-gray-50 p-4 rounded-lg flex flex-wrap gap-6 justify-center items-center text-sm text-gray-600 font-medium border">
                                <div className="flex items-center"><span className="w-4 h-4 bg-purple-500 rounded block mr-2 shadow-sm"></span>VIP석</div>
                                <div className="flex items-center"><span className="w-4 h-4 bg-green-500 rounded block mr-2 shadow-sm"></span>일반석 / 스탠딩</div>
                                <div className="flex items-center"><span className="w-4 h-4 bg-gray-300 opacity-50 rounded block mr-2"></span>예매 완료 (선택 불가)</div>
                            </div>
                        </div>
                    )}

                    {/* 결제 화면 */}
                    {view === 'payment' && (
                        <div className="max-w-md mx-auto mt-12 bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
                            {!pending ? (
                                <div className="text-center py-10">
                                    <div className="w-12 h-12 mx-auto mb-4 border-4 border-gray-200 border-t-red-600 rounded-full animate-spin"></div>
                                    <p className="text-gray-500 mb-6">좌석을 선점하는 중입니다...</p>
                                    <button onClick={leavePayment} className="text-gray-400 text-sm hover:underline">취소하고 돌아가기</button>
                                </div>
                            ) : (
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-1">결제</h2>
                                    <p className="text-sm text-gray-500 mb-6">{pending.concertTitle}</p>

                                    <div className="bg-gray-50 rounded-xl p-5 border mb-6">
                                        <div className="flex justify-between mb-2"><span className="text-gray-500">좌석</span><span className="font-bold">{pending.seatName}</span></div>
                                        <div className="flex justify-between"><span className="text-gray-500">금액</span><span className="font-bold text-red-600">{pending.price.toLocaleString()}원</span></div>
                                    </div>

                                    <div className="text-center mb-6">
                                        <p className="text-sm text-gray-400 mb-1">결제 마감까지</p>
                                        <p className={`text-4xl font-black ${remainSec !== null && remainSec <= 30 ? 'text-red-600' : 'text-gray-800'}`}>
                                            {remainSec === null ? '--:--' :
                                                `${String(Math.floor(remainSec / 60)).padStart(2, '0')}:${String(remainSec % 60).padStart(2, '0')}`}
                                        </p>
                                    </div>

                                    <button onClick={handlePay} className="w-full bg-red-600 text-white p-3 rounded-lg font-bold hover:bg-red-700 transition mb-2">
                                        {pending.price.toLocaleString()}원 결제하기
                                    </button>
                                    <button onClick={leavePayment} className="w-full text-gray-500 text-sm py-2 hover:underline">
                                        나중에 결제 (마이페이지에서 이어서 결제)
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* 5. 마이페이지 */}
                    {view === 'mypage' && (
                        <div className="max-w-3xl mx-auto mt-4">
                            <div className="flex justify-between items-end mb-6">
                                <h2 className="text-3xl font-black text-gray-800">마이 티켓</h2>
                                <button onClick={() => setView('concertList')} className="text-red-600 font-bold hover:underline text-sm">
                                    공연 목록으로 &rarr;
                                </button>
                            </div>

                            {/* 결제 대기 목록 (선점만 하고 미결제 상태 → 시간 내 이어서 결제) */}
                            {pendingList.length > 0 && (
                                <div className="mb-8">
                                    <h3 className="text-lg font-bold text-gray-700 mb-3">결제 대기</h3>
                                    <div className="space-y-3">
                                        {pendingList.map(p => {
                                            const remain = Math.floor((new Date(p.expiresAt).getTime() - now) / 1000);
                                            const expired = remain <= 0;
                                            return (
                                                <div key={p.reservationId} className="bg-white rounded-xl shadow-sm border border-red-200 p-5 flex justify-between items-center">
                                                    <div>
                                                        <p className="font-bold text-gray-900">{p.concertTitle}</p>
                                                        <p className="text-sm text-gray-600">{p.seatName} · {p.price.toLocaleString()}원</p>
                                                        <p className={`text-sm mt-1 font-bold ${expired ? 'text-gray-400' : 'text-red-600'}`}>
                                                            {expired ? '시간 만료 (좌석이 해제됩니다)' : `결제 마감까지 ${formatMMSS(remain)}`}
                                                        </p>
                                                    </div>
                                                    <button onClick={() => resumePayment(p)} disabled={expired}
                                                        className={`px-4 py-2 rounded-lg font-bold text-sm transition ${expired ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-red-600 text-white hover:bg-red-700'}`}>
                                                        결제하기
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {(myReservations.length === 0 && pendingList.length === 0) ? (
                                <div className="bg-white p-16 rounded-xl shadow-lg border border-gray-200 text-center text-gray-400 font-medium">
                                    <span className="text-5xl block mb-4">🎫</span>
                                    아직 예매한 내역이 없습니다.
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {myReservations.map(res => (
                                        <div key={res.reservationId} className="flex bg-white rounded-xl shadow-md border overflow-hidden transition hover:shadow-lg">
                                            {/* 티켓 절취선 효과 */}
                                            <div className="bg-red-600 w-6 flex-shrink-0 ticket-cutout"></div>

                                            <div className="p-6 flex-1 flex flex-col md:flex-row justify-between md:items-center">
                                                <div>
                                                    <span className="text-xs font-bold text-red-600 mb-1 block tracking-wider uppercase">예매완료</span>
                                                    <h3 className="text-xl font-bold text-gray-900 mb-2">{res.concertTitle}</h3>
                                                    <p className="text-sm text-gray-600 font-medium">
                                                        {res.seatName} <span className="mx-2 text-gray-300">|</span> {res.price.toLocaleString()}원
                                                    </p>
                                                </div>
                                                <div className="md:text-right border-t md:border-t-0 md:border-l pt-4 md:pt-0 md:pl-6 border-dashed border-gray-200 mt-4 md:mt-0">
                                                    <p className="text-xs text-gray-400 mb-1">예매번호: <span className="font-mono text-gray-800 font-bold">{res.reservationId}</span></p>
                                                    <p className="text-xs text-gray-400">결제일시: {new Date(res.reservedAt).toLocaleString()}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </main>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
