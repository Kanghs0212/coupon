spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coupon}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  tomcat:
    threads:
      max: 1000
    accept-count: 10000
    max-connections: 10000

# JWT 서명 비밀키 (HS256, 32바이트 이상). 운영 시 환경변수 주입 권장
jwt:
  secret: ${JWT_SECRET:catch-seat-super-secret-key-please-change-in-production-32bytes}

# 애플리케이션 설정
app:
  # 앱 시작 시 콘서트/좌석/예매 시딩 여부 (회원은 유지, false면 비활성화)
  data-init:
    enabled: true
  coupon:
    id: 1              # 워커가 처리할 쿠폰 ID
    limit: 10000       # 선착순 발급 한도
    worker-delay-ms: 1000
  ticket:
    lock-ttl-minutes: 10   # 좌석 선점 락 유지 시간
    worker-delay-ms: 500
    hold-minutes: 5        # 좌석 선점 후 결제 마감까지 시간
    hold-check-ms: 10000   # 미결제 선점 자동 해제 점검 주기(ms)
  waiting:
    admit-per-tick: 5         # 한 틱에 입장시킬 인원
    tick-ms: 2000             # 입장 처리 주기(ms)
    passed-ttl-minutes: 30    # 입장 권한 유지 시간